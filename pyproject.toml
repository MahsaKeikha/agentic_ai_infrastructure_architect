[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-infrastructure-architect"
version = "1.0.0"
description = "L3 Gold Standard reference multi-agent system for AI infrastructure architecture, capacity, reliability, cost, and deployment readiness"
requires-python = ">=3.10"
authors = [{name = "Mahsa Keikha"}]
license = {text = "MIT"}
readme = "README.md"
keywords = ["agentic-ai", "multi-agent", "infrastructure", "reliability", "capacity-planning", "gold-standard"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["."]
include = ["AGENTS*", "SKILLS*", "TOOLS*", "orchestration*"]
namespaces = true
